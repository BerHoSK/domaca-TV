name: Domáca TV – zostavenie APK

# Zostaví launcher pri každom pushi do main alebo ručne (Actions → Run workflow).
# Hotové APK nájdeš na stránke repozitára vpravo v časti Releases → "Najnovší launcher"
# (a aj v behu workflowu v časti Artifacts).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Podpisový kľúč zo Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Chýba secret KEYSTORE_BASE64, APK bude podpísané dočasným ladiacim kľúčom."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/domaca-tv.jks"
            echo "DOMACA_KEYSTORE_FILE=$RUNNER_TEMP/domaca-tv.jks" >> "$GITHUB_ENV"
          fi
      - name: Zostavenie launchera
        working-directory: launcher
        env:
          DOMACA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../domaca-tv-launcher.apk
      - name: Zostavenie doplnku Rádio
        working-directory: addons/radio
        env:
          DOMACA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../domaca-tv-radio.apk
      - name: Zostavenie doplnku Počasie
        working-directory: addons/weather
        env:
          DOMACA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../domaca-tv-pocasie.apk
      - uses: actions/upload-artifact@v4
        with:
          name: domaca-tv-launcher
          path: |
            domaca-tv-launcher.apk
            domaca-tv-radio.apk
            domaca-tv-pocasie.apk
          retention-days: 30
      - name: Zverejnenie v Releases (Najnovší launcher)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete najnovsi --yes --cleanup-tag || true
          gh release create najnovsi domaca-tv-launcher.apk domaca-tv-radio.apk domaca-tv-pocasie.apk \
            --title "Najnovší launcher" \
            --notes "Automaticky zostavené z commitu ${GITHUB_SHA::7}. Launcher: domaca-tv-launcher.apk, doplnok Rádio: domaca-tv-radio.apk, doplnok Počasie: domaca-tv-pocasie.apk." \
            --target "$GITHUB_SHA" --latest
