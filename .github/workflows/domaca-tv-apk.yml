name: Domáca TV – zostavenie APK

# Zostaví launcher pri každom pushi do main alebo ručne (Actions → Run workflow).
# Hotové APK nájdeš v behu workflowu dole v časti "Artifacts" (domaca-tv-launcher).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Zostavenie launchera
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../domaca-tv-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: domaca-tv-launcher
          path: domaca-tv-launcher.apk
          retention-days: 30
